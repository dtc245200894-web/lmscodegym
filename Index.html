<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập UI/UX - Trang Đăng Ký</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .page {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        .page.active {
            display: block;
            opacity: 1;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100 p-8">
        
        <div id="register-page" class="page active">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-slate-800">Tạo tài khoản mới</h1>
                <p class="text-sm text-slate-500 mt-1">Vui lòng điền thông tin bên dưới để bắt đầu</p>
            </div>

            <form id="register-form" class="space-y-4" onsubmit="handleRegister(event)">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Họ và tên</label>
                    <input type="text" id="fullname" required 
                        class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm transition"
                        placeholder="Ví dụ: Nguyễn Văn A">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                    <input type="email" id="email" required 
                        class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm transition"
                        placeholder="name@example.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Mật khẩu</label>
                    <div class="relative">
                        <input type="password" id="password" required minlength="6"
                            class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm transition pr-10"
                            placeholder="Ít nhất 6 ký tự">
                        <button type="button" onclick="togglePassword('password', 'eye-icon-1')" class="absolute right-3 top-3.5 text-slate-400 hover:text-slate-600 focus:outline-none">
                            <svg id="eye-icon-1" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Xác nhận mật khẩu</label>
                    <div class="relative">
                        <input type="password" id="confirm-password" required 
                            class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm transition pr-10"
                            placeholder="Nhập lại mật khẩu của bạn">
                        <button type="button" onclick="togglePassword('confirm-password', 'eye-icon-2')" class="absolute right-3 top-3.5 text-slate-400 hover:text-slate-600 focus:outline-none">
                            <svg id="eye-icon-2" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                    <p id="error-msg" class="text-xs text-red-500 mt-1 hidden">Mật khẩu xác nhận không khớp!</p>
                </div>
                <button type="submit" 
                    class="w-full mt-2 bg-blue-600 hover:bg-blue-700 text-white font-medium py-3.5 px-4 rounded-lg shadow-lg shadow-blue-500/30 transition duration-200">
                    Đăng ký tài khoản
                </button>
            </form>
        </div>

        <div id="success-page" class="page text-center py-6">
            <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-slate-800 mb-2">Đăng ký thành công!</h2>
            <p class="text-sm text-slate-500 mb-6">
                Chào mừng <span id="display-name" class="font-semibold text-slate-700"></span> đã tham gia. Chúng tôi đã gửi một email xác thực đến <span id="display-email" class="font-semibold text-slate-700"></span>.
            </p>
            <button onclick="resetForm()" 
                class="w-full bg-slate-800 hover:bg-slate-900 text-white font-medium py-3.5 px-4 rounded-lg transition duration-200">
                Quay lại trang đăng ký
            </button>
        </div>

    </div>
    <script>
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === "password") {
                input.type = "text";
                icon.classList.add("text-blue-600");
            } else {
                input.type = "password";
                icon.classList.remove("text-blue-600");
            }
        }

        function handleRegister(event) {
            event.preventDefault();
            
            const fullname = document.getElementById('fullname').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const errorMsg = document.getElementById('error-msg');

            if (password !== confirmPassword) {
                errorMsg.classList.remove('hidden');
                document.getElementById('confirm-password').focus();
                return;
            }
            errorMsg.classList.add('hidden');

            document.getElementById('display-name').innerText = fullname;
            document.getElementById('display-email').innerText = email;

            document.getElementById('register-page').classList.remove('active');
            document.getElementById('success-page').classList.add('active');
        }

        function resetForm() {
            document.getElementById('register-form').reset();
            document.getElementById('success-page').classList.remove('active');
            document.getElementById('register-page').classList.add('active');
        }
    </script>
</body>
</html>
